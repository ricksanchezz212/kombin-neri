<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Style Mood App 😎</title>

<style>
body {
  font-family: Arial;
  background: #0d0d0d;
  color: white;
  text-align: center;
  padding: 20px;
}

h1 { margin-bottom: 5px; }

.card {
  background: #1c1c1c;
  padding: 20px;
  border-radius: 20px;
  max-width: 500px;
  margin: auto;
  margin-top: 20px;
  box-shadow: 0 0 15px rgba(255,0,85,0.2);
  transition: 0.3s;
}

button {
  margin: 6px;
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #2a2a2a;
  color: white;
  transition: 0.2s;
}

button:hover {
  background: #ff0055;
  transform: scale(1.05);
}

.step { display: none; }
.active { display: block; }

.title {
  color: #ffcc00;
  margin-bottom: 10px;
}

/* küçük animasyon */
.pop {
  animation: pop 0.3s ease;
}

@keyframes pop {
  from { transform: scale(0.95); opacity: 0.5; }
  to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<h1>😎 Style Mood App</h1>
<p>Seç veya şansa bırak 🎲</p>

<button onclick="randomAll()">🎲 Random Kombin</button>

<div class="card pop" id="resultBox">

<!-- STEP 1 -->
<div id="step1" class="step active">
  <div class="title">1️⃣ Ruh halini seç</div>
  <button onclick="setMood('confident')">🔥 Özgüvenli</button>
  <button onclick="setMood('tired')">😴 Yorgun</button>
  <button onclick="setMood('energetic')">⚡ Enerjik</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="step">
  <div class="title">2️⃣ Stil seç</div>
  <button onclick="setStyle('street')">🧢 Street</button>
  <button onclick="setStyle('old')">💼 Old Money</button>
  <button onclick="setStyle('drip')">🔥 Drip</button>
</div>

<!-- STEP 3 -->
<div id="step3" class="step">
  <div class="title">3️⃣ Durum</div>
  <button onclick="setSituation('school')">🏫 Okul</button>
  <button onclick="setSituation('out')">🌆 Dışarı</button>
  <button onclick="setSituation('date')">💘 Date</button>
</div>

</div>

<div class="card" id="result" style="display:none;"></div>

<script>

let mood = "";
let style = "";
let situation = "";

function setMood(m){ mood = m; next(2); }
function setStyle(s){ style = s; next(3); }
function setSituation(si){ situation = si; show(); }

function next(step){
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + step).classList.add('active');
}

function buildResult(m, s, si){

  let text = "";

  if(s === "street"){
    text = "🧢 Street: Hoodie + baggy jean + sneaker";
  }

  if(s === "old"){
    text = "💼 Old Money: Gömlek + slim pantolon + clean sneaker";
  }

  if(s === "drip"){
    text = "🔥 Drip: Oversize tee + cargo + hype sneaker";
  }

  if(m === "tired") text += " | 😴 chill mode";
  if(m === "energetic") text += " | ⚡ dikkat çekme";
  if(m === "confident") text += " | 🔥 dominant vibe";

  if(si === "school") text += " | 🏫 okul";
  if(si === "out") text += " | 🌆 dışarı";
  if(si === "date") text += " | 💘 date";

  return text;
}

function show(){

  const text = buildResult(mood, style, situation);

  document.getElementById('result').style.display = "block";
  document.getElementById('result').classList.add("pop");

  document.getElementById('result').innerHTML = `
    <div class="title">🎯 Senin Kombinin</div>
    <div>${text}</div>
  `;

  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
}

function randomAll(){

  const moods = ["confident","tired","energetic"];
  const styles = ["street","old","drip"];
  const situations = ["school","out","date"];

  mood = moods[Math.floor(Math.random()*moods.length)];
  style = styles[Math.floor(Math.random()*styles.length)];
  situation = situations[Math.floor(Math.random()*situations.length)];

  show();
}

</script>

</body>
</html>
