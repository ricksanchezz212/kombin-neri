<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Mood Style Matcher 😎</title>

  <style>
    body {
      font-family: Arial;
      background: #0d0d0d;
      color: white;
      text-align: center;
      padding: 30px;
    }

    button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #1f1f1f;
      color: white;
    }

    button:hover {
      background: #ff0055;
    }

    .box {
      margin-top: 20px;
      background: #1c1c1c;
      padding: 20px;
      border-radius: 15px;
      max-width: 500px;
      margin: auto;
      text-align: left;
    }

    .title {
      color: #ffcc00;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<h1>😎 Mood Style Matcher</h1>
<p>Ruh halini seç, sana kombin verelim</p>

<button onclick="pick('confident')">🔥 Özgüvenli</button>
<button onclick="pick('tired')">😴 Yorgun</button>
<button onclick="pick('energetic')">⚡ Enerjik</button>
<button onclick="pick('chill')">🧃 Umursamaz</button>
<button onclick="pick('thinking')">🧠 Düşünceli</button>

<div class="box" id="result">
  Mood seçince burada kombin çıkacak
</div>

<script>
function pick(mood){

  let result = "";

  if(mood === "confident"){
    result = "🔥 Oversize hoodie + baggy jean + sneaker + zincir → 'ben buradayım' vibe";
  }

  if(mood === "tired"){
    result = "😴 Basic hoodie + eşofman + rahat sneaker → minimum efor modu";
  }

  if(mood === "energetic"){
    result = "⚡ Renkli hoodie + cargo pant + chunky sneaker → dikkat çekme modu";
  }

  if(mood === "chill"){
    result = "🧃 Basic tişört + relaxed pantolon + sade sneaker → umursamaz cool";
  }

  if(mood === "thinking"){
    result = "🧠 Minimal outfit + koyu renkler + sade stil → derin düşünce vibe";
  }

  document.getElementById("result").innerHTML = `
    <div class="title">Kombin Önerisi</div>
    <div>${result}</div>
  `;
}
</script>

</body>
</html>
