<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Style Mood App 😎</title>

<style>
body {
  font-family: Arial;
  background: #0d0d0d;
  color: white;
  text-align: center;
  padding: 20px;
}

h1 { margin-bottom: 5px; }

p { opacity: 0.7; }

/* kart */
.card {
  background: #1c1c1c;
  padding: 20px;
  border-radius: 15px;
  max-width: 500px;
  margin: 15px auto;
}

/* butonlar */
button {
  margin: 6px;
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #2a2a2a;
  color: white;
  transition: 0.15s;
}

/* hover */
button:hover {
  background: #3a3a3a;
}

/* basma hissi */
button:active {
  transform: scale(0.96);
}

/* seçili buton */
button.selected {
  background: #ff0055;
  color: white;
  box-shadow: 0 0 10px rgba(255,0,85,0.6);
}

/* sonuç */
.result {
  margin-top: 15px;
  background: #111;
  padding: 15px;
  border-radius: 15px;
  border: 1px solid #2a2a2a;
  animation: pop 0.25s ease;
}

@keyframes pop {
  from { transform: scale(0.95); opacity: 0.5; }
  to { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<h1>😎 Style Mood App</h1>
<p>Seç → kombin al → vibe bul</p>

<div class="card">
  <h3>1️⃣ Mood</h3>
  <button onclick="setMood('confident', event)">🔥 Özgüvenli</button>
  <button onclick="setMood('tired', event)">😴 Yorgun</button>
  <button onclick="setMood('energetic', event)">⚡ Enerjik</button>
</div>

<div class="card">
  <h3>2️⃣ Stil</h3>
  <button onclick="setStyle('street', event)">🧢 Street</button>
  <button onclick="setStyle('old', event)">💼 Old Money</button>
  <button onclick="setStyle('drip', event)">🔥 Drip</button>
</div>

<div class="card">
  <h3>3️⃣ Durum</h3>
  <button onclick="setSituation('school', event)">🏫 Okul</button>
  <button onclick="setSituation('out', event)">🌆 Dışarı</button>
  <button onclick="setSituation('date', event)">💘 Date</button>
</div>

<div id="result"></div>

<script>

let mood = "";
let style = "";
let situation = "";

/* seçim sistemi */
function setMood(val, e){
  mood = val;
  select(e);
  check();
}

function setStyle(val, e){
  style = val;
  select(e);
  check();
}

function setSituation(val, e){
  situation = val;
  select(e);
  check();
}

/* seçili buton kontrol */
function select(e){
  let parent = e.target.parentElement;
  parent.querySelectorAll("button").forEach(b => b.classList.remove("selected"));
  e.target.classList.add("selected");
}

/* hazır mı kontrol */
function check(){
  if(mood && style && situation){
    showResult();
  }
}

/* kombin üret */
function build(){

  let text = "";

  if(style === "street"){
    text = "🧢 Street: Hoodie + baggy jean + sneaker";
  }

  if(style === "old"){
    text = "💼 Old Money: Gömlek + slim pantolon + clean sneaker";
  }

  if(style === "drip"){
    text = "🔥 Drip: Oversize tee + cargo + hype sneaker";
  }

  if(mood === "tired") text += " | 😴 chill mode";
  if(mood === "energetic") text += " | ⚡ full enerji";
  if(mood === "confident") text += " | 🔥 dominant vibe";

  if(situation === "school") text += " | 🏫 okul";
  if(situation === "out") text += " | 🌆 dışarı";
  if(situation === "date") text += " | 💘 date";

  return text;
}

/* sonuç göster */
function showResult(){
  document.getElementById("result").innerHTML = `
    <div class="result">
      <b>🎯 Senin Kombinin</b><br><br>
      ${build()}
    </div>
  `;
}

</script>

</body>
</html>
