<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Style Mood App 😎</title>

<style>
body {
  font-family: Arial;
  background: #0d0d0d;
  color: white;
  text-align: center;
  padding: 20px;
}

h1 { margin-bottom: 5px; }

.card {
  background: #1c1c1c;
  padding: 20px;
  border-radius: 15px;
  max-width: 500px;
  margin: auto;
  margin-top: 20px;
}

button {
  margin: 6px;
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #2a2a2a;
  color: white;
}

button:hover {
  background: #ff0055;
}

.step {
  display: none;
}

.active {
  display: block;
}

.title {
  color: #ffcc00;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<h1>😎 Style Mood App</h1>
<p>Seçim yap → sana kombin verelim</p>

<div class="card">

<!-- STEP 1 -->
<div id="step1" class="step active">
  <div class="title">1️⃣ Ruh halini seç</div>
  <button onclick="setMood('confident')">🔥 Özgüvenli</button>
  <button onclick="setMood('tired')">😴 Yorgun</button>
  <button onclick="setMood('energetic')">⚡ Enerjik</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="step">
  <div class="title">2️⃣ Stil seç</div>
  <button onclick="setStyle('street')">🧢 Street</button>
  <button onclick="setStyle('old')">💼 Old Money</button>
  <button onclick="setStyle('drip')">🔥 Drip</button>
</div>

<!-- STEP 3 -->
<div id="step3" class="step">
  <div class="title">3️⃣ Günlük durum</div>
  <button onclick="setSituation('school')">🏫 Okul</button>
  <button onclick="setSituation('out')">🌆 Dışarı</button>
  <button onclick="setSituation('date')">💘 Date</button>
</div>

</div>

<div class="card" id="result" style="display:none;"></div>

<script>

let mood = "";
let style = "";
let situation = "";

function setMood(m){
  mood = m;
  nextStep(2);
}

function setStyle(s){
  style = s;
  nextStep(3);
}

function setSituation(si){
  situation = si;
  showResult();
}

function nextStep(step){

  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));

  document.getElementById('step' + step).classList.add('active');
}

function showResult(){

  let text = "";

  if(style === "street"){
    text = "🧢 Street outfit: Oversize hoodie + baggy jean + sneaker + cap";
  }

  if(style === "old"){
    text = "💼 Old Money: Beyaz gömlek + slim pantolon + clean sneaker";
  }

  if(style === "drip"){
    text = "🔥 Drip: Oversize tee + cargo pant + zincir + hype sneaker";
  }

  // mood ek etkisi
  if(mood === "tired"){
    text += " (rahatlık max seviyede)";
  }

  if(mood === "energetic"){
    text += " (dikkat çekme modu açık)";
  }

  if(mood === "confident"){
    text += " (dominant vibe)";
  }

  // durum ek etkisi
  if(situation === "school"){
    text += " | 🏫 Okul için uygun";
  }

  if(situation === "out"){
    text += " | 🌆 Dışarı kombin";
  }

  if(situation === "date"){
    text += " | 💘 Date için temiz görünüm";
  }

  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerHTML = `
    <div class="title">🎯 Senin Kombinin</div>
    <div>${text}</div>
  `;

  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
}

</script>

</body>
</html>
