<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Style Mood App 😎</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b0f;
  color: white;
  display: flex;
  justify-content: center;
}

/* telefon gibi frame */
.app {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  background: #12121a;
  padding: 20px;
  box-sizing: border-box;
}

/* header */
h1 {
  font-size: 24px;
  margin: 10px 0 5px;
}

p {
  opacity: 0.7;
  font-size: 13px;
}

/* kart hissi */
.card {
  background: #1c1c2a;
  border-radius: 18px;
  padding: 16px;
  margin-top: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  transition: 0.3s;
}

/* butonlar */
button {
  width: 100%;
  margin: 6px 0;
  padding: 12px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  background: #2a2a3a;
  color: white;
  transition: 0.2s;
}

button:hover {
  background: #ff0055;
  transform: scale(1.02);
}

/* alt sonuç kartı */
.result {
  background: linear-gradient(135deg, #ff0055, #7a00ff);
  padding: 15px;
  border-radius: 15px;
  margin-top: 15px;
  animation: pop 0.25s ease;
}

@keyframes pop {
  from { transform: scale(0.95); opacity: 0.5; }
  to { transform: scale(1); opacity: 1; }
}

/* küçük label */
.title {
  font-size: 14px;
  opacity: 0.8;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="app">

<h1>😎 Style Mood App</h1>
<p>Seç → kombin al → vibe bul</p>

<div class="card">
  <div class="title">1️⃣ Ruh hali</div>
  <button onclick="setMood('confident')">🔥 Özgüvenli</button>
  <button onclick="setMood('tired')">😴 Yorgun</button>
  <button onclick="setMood('energetic')">⚡ Enerjik</button>
</div>

<div class="card">
  <div class="title">2️⃣ Stil</div>
  <button onclick="setStyle('street')">🧢 Street</button>
  <button onclick="setStyle('old')">💼 Old Money</button>
  <button onclick="setStyle('drip')">🔥 Drip</button>
</div>

<div class="card">
  <div class="title">3️⃣ Durum</div>
  <button onclick="setSituation('school')">🏫 Okul</button>
  <button onclick="setSituation('out')">🌆 Dışarı</button>
  <button onclick="setSituation('date')">💘 Date</button>
</div>

<div id="result"></div>

</div>

<script>

let mood = "";
let style = "";
let situation = "";

function setMood(m){ mood = m; check(); }
function setStyle(s){ style = s; check(); }
function setSituation(si){ situation = si; check(); }

function check(){
  if(mood && style && situation){
    show();
  }
}

function build(){

  let text = "";

  if(style === "street"){
    text = "🧢 Street: Hoodie + baggy jean + sneaker";
  }

  if(style === "old"){
    text = "💼 Old Money: Gömlek + slim pantolon + clean sneaker";
  }

  if(style === "drip"){
    text = "🔥 Drip: Oversize tee + cargo + hype sneaker";
  }

  if(mood === "tired") text += " | 😴 chill mode";
  if(mood === "energetic") text += " | ⚡ enerji full";
  if(mood === "confident") text += " | 🔥 dominant vibe";

  if(situation === "school") text += " | 🏫 okul";
  if(situation === "out") text += " | 🌆 dışarı";
  if(situation === "date") text += " | 💘 date";

  return text;
}

function show(){

  document.getElementById("result").innerHTML = `
    <div class="result">
      <b>🎯 Senin Kombinin</b><br><br>
      ${build()}
    </div>
  `;
}

</script>

</body>
</html>
